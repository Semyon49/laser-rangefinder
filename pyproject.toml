[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-rangefinder"
version = "0.2.0"
description = "Дальномер по двум лазерным пятнам и камере (OpenCV)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["opencv-python"]            # Windows / ПК с окном
headless = ["opencv-python-headless"]
dev = ["pytest"]

[project.scripts]
rangefinder = "rangefinder.cli:main"

[tool.setuptools]
packages = ["rangefinder"]
